<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>转写测试 · Klassenhelfer</title>
<style>
  :root {
    --bg:#0a0d12; --card:#151b26; --line:#232c3d; --text:#e8eef7;
    --dim:#8d9bb0; --dim2:#6b7789; --accent:#4f9cf9; --ok:#38d39f; --bad:#ff6b6b; --warn:#ffb84d;
  }
  * { box-sizing: border-box; }
  body {
    margin:0 auto; background:var(--bg); color:var(--text); font-size:15px; line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:16px 14px calc(env(safe-area-inset-bottom) + 30px); max-width:640px;
  }
  h1 { font-size:17px; margin:0 0 4px; }
  .sub { color:var(--dim2); font-size:12px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--dim); margin:12px 0 5px; }
  input, select {
    width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-size:14px; padding:10px 11px; outline:none; font-family:inherit;
  }
  input:focus, select:focus { border-color:var(--accent); }
  .tip { font-size:11px; color:var(--dim2); margin-top:4px; }
  button {
    width:100%; margin-top:16px; border:none; border-radius:12px; padding:14px;
    font-size:15px; font-weight:600; font-family:inherit; cursor:pointer;
    background:linear-gradient(180deg,#6fb0ff,var(--accent)); color:#06111f;
  }
  button:disabled { opacity:.5; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:14px; font-size:13px; }
  .box h2 { font-size:12px; margin:0 0 8px; color:var(--dim); font-weight:600; }
  .meter { display:flex; align-items:flex-end; gap:3px; height:44px; }
  .meter i { flex:1; background:#243045; border-radius:2px; height:4px; }
  .meter i.hot { background:var(--ok); }
  #result { font-size:18px; line-height:1.5; color:#fff; word-break:break-word; min-height:28px; }
  .kv { color:var(--dim); font-size:12px; line-height:1.7; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
</style>
</head>
<body>

<h1>转写测试</h1>
<div class="sub">录 4 秒德语 → 发到 Groq 转写。这是服务器端识别的完整链路，测通了主应用就能用。</div>

<label for="provider">服务商</label>
<select id="provider">
  <option value="groq">Groq · whisper-large-v3-turbo</option>
  <option value="deepgram">Deepgram · nova-3（送 $200）</option>
  <option value="siliconflow">SiliconFlow · SenseVoice</option>
  <option value="openai">OpenAI · whisper-1</option>
</select>

<label for="key">API Key</label>
<input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="填选中那家的 Key">
<div class="tip">Groq: console.groq.com · Deepgram: console.deepgram.com · SiliconFlow: cloud.siliconflow.cn</div>

<label for="lang">语言</label>
<select id="lang">
  <option value="de">德语 de</option>
  <option value="en">英语 en</option>
  <option value="zh">中文 zh</option>
</select>

<button id="run">录 4 秒，然后转写</button>

<div class="box">
  <h2>录音电平</h2>
  <div class="meter" id="meter"></div>
</div>

<div class="box">
  <h2>转写结果</h2>
  <div id="result" class="kv">—</div>
  <div class="kv" id="meta" style="margin-top:8px"></div>
</div>

<script src="asr.js"></script>
<script>
(function () {
  "use strict";

  var keyEl = document.getElementById("key");
  var langEl = document.getElementById("lang");
  var runEl = document.getElementById("run");
  var resultEl = document.getElementById("result");
  var metaEl = document.getElementById("meta");
  var meter = document.getElementById("meter");

  // 记住 Key，避免每次都输
  try {
    var saved = localStorage.getItem("kh.asr.test.key");
    if (saved) keyEl.value = saved;
  } catch (e) {}
  keyEl.addEventListener("change", function () {
    try { localStorage.setItem("kh.asr.test.key", keyEl.value.trim()); } catch (e) {}
  });

  var BARS = 20;
  var bars = [];
  for (var i = 0; i < BARS; i++) {
    var b = document.createElement("i");
    meter.appendChild(b);
    bars.push(b);
  }

  function setMeta(html) { metaEl.innerHTML = html; }

  async function run() {
    var key = keyEl.value.trim();
    if (!key) {
      resultEl.innerHTML = '<span class="bad">先填 Key</span>';
      return;
    }

    runEl.disabled = true;
    resultEl.textContent = "录音中…";
    setMeta("");
    bars.forEach(function (b) { b.style.height = "4px"; b.classList.remove("hot"); });

    var stream = null;
    var ctx = null;
    var raf = 0;

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
      });

      ctx = new (window.AudioContext || window.webkitAudioContext)();
      var src = ctx.createMediaStreamSource(stream);
      var analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      src.connect(analyser);
      var buf = new Uint8Array(analyser.fftSize);

      (function tick() {
        analyser.getByteTimeDomainData(buf);
        var sum = 0;
        for (var i = 0; i < buf.length; i++) {
          var v = (buf[i] - 128) / 128;
          sum += v * v;
        }
        var rms = Math.sqrt(sum / buf.length);
        var lit = Math.round(Math.min(1, rms * 6) * BARS);
        for (var j = 0; j < BARS; j++) {
          bars[j].style.height = (j < lit ? 6 + (j / BARS) * 38 : 4) + "px";
          bars[j].classList.toggle("hot", j < lit);
        }
        raf = requestAnimationFrame(tick);
      })();

      var mime = "";
      var cands = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
      for (var k = 0; k < cands.length; k++) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(cands[k])) { mime = cands[k]; break; }
      }

      var chunks = [];
      var rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };

      var done = new Promise(function (resolve) { rec.onstop = resolve; });
      rec.start();
      await new Promise(function (r) { setTimeout(r, 4000); });
      rec.stop();
      await done;

      cancelAnimationFrame(raf);
      stream.getTracks().forEach(function (t) { t.stop(); });
      try { ctx.close(); } catch (e) {}

      var blob = new Blob(chunks, { type: mime || "audio/webm" });
      var t0 = Date.now();
      resultEl.textContent = "上传转写中…";
      setMeta("音频 " + Math.round(blob.size / 1024) + " KB · " + (mime || "默认格式"));

      var text = await window.KH_ASR.transcribe(blob, {
        apiKey: key,
        provider: document.getElementById("provider").value,
        language: langEl.value === "de" ? "de-DE" : langEl.value === "zh" ? "zh-CN" : "en-US"
      });

      var ms = Date.now() - t0;
      if (text) {
        resultEl.innerHTML = '<span class="ok">' + text.replace(/</g, "&lt;") + "</span>";
        setMeta("转写耗时 " + ms + "ms · 成功 ✓");
      } else {
        resultEl.innerHTML = '<span class="warn">（转写结果为空，可能没录到声音）</span>';
        setMeta("耗时 " + ms + "ms");
      }
    } catch (e) {
      if (raf) cancelAnimationFrame(raf);
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      if (ctx) { try { ctx.close(); } catch (e2) {} }
      resultEl.innerHTML = '<span class="bad">失败：' + (e.message || e) + "</span>";
      setMeta("如果是 401，说明 Key 不对；如果是 Failed to fetch，检查网络");
    } finally {
      runEl.disabled = false;
    }
  }

  runEl.addEventListener("click", run);
})();
</script>
</body>
</html>
